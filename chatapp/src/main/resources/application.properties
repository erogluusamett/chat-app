# =============================================
# ChatApp Backend - Application Configuration
# =============================================

# Server
server.port=8082
server.address=0.0.0.0

# =============================================
# PostgreSQL Database
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=ChatAppHikariPool

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# JWT Settings
# =============================================
app.jwt.secret=chatapp_super_secret_key_wireless_networks_project_2024_secure_random_256bit
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.max-size=10485760

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# =============================================
# WebSocket
# =============================================
app.websocket.endpoint=/ws
app.websocket.allowed-origins=*

# =============================================
# Logging
# =============================================
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.security=INFO